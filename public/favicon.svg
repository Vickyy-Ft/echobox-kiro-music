<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Halloween Monster Music Icon: Demon skull with musical note -->
  <rect width="48" height="48" rx="8" fill="#000000"/>
  
  <!-- Blood red glow background -->
  <circle cx="24" cy="24" r="20" fill="url(#redGlow)" opacity="0.3"/>
  
  <!-- Demon skull shape -->
  <ellipse cx="24" cy="22" rx="14" ry="16" fill="#830000"/>
  <ellipse cx="24" cy="22" rx="12" ry="14" fill="#BC0202"/>
  
  <!-- Evil eyes (glowing red) -->
  <ellipse cx="18" cy="20" rx="3" ry="4" fill="#FF0000"/>
  <ellipse cx="30" cy="20" rx="3" ry="4" fill="#FF0000"/>
  <circle cx="18" cy="19" r="1.5" fill="#ffffff"/>
  <circle cx="30" cy="19" r="1.5" fill="#ffffff"/>
  
  <!-- Fangs/teeth -->
  <path d="M 20 28 L 18 32 L 20 30 Z" fill="#ffffff"/>
  <path d="M 28 28 L 30 32 L 28 30 Z" fill="#ffffff"/>
  
  <!-- Evil grin -->
  <path d="M 16 28 Q 24 32 32 28" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Musical note (blood red) -->
  <path d="M 36 10 L 36 24 C 36 25.5 34.5 27 33 27 C 31.5 27 30 25.5 30 24 C 30 22.5 31.5 21 33 21 C 33.8 21 34.5 21.3 35 21.8 L 35 14 L 40 12 L 40 16 Z" fill="#FF0000"/>
  
  <!-- Horns -->
  <path d="M 14 12 Q 12 8 10 10 L 14 14 Z" fill="#BC0202"/>
  <path d="M 34 12 Q 36 8 38 10 L 34 14 Z" fill="#BC0202"/>
  
  <!-- Red glow gradient definition -->
  <defs>
    <radialGradient id="redGlow">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#830000"/>
    </radialGradient>
  </defs>
</svg>
